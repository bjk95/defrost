description: Defrost smoke test for the promptfoo adapter

prompts:
  - 'What is the capital of {{country}}? Answer in one word.'

providers:
  - id: file://provider.js
    label: defrost-smoke-mock

tests:
  - vars:
      country: France
    assert:
      - type: contains
        value: Paris
      - type: llm-rubric
        value: A single-word answer
  - vars:
      country: Germany
    assert:
      - type: contains
        value: Berlin
      - type: llm-rubric
        value: A single-word answer
