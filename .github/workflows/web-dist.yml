name: Rebuild web/dist

on:
  push:
    paths:
      - 'web/src/**'
      - 'web/index.html'
      - 'web/package.json'
      - 'web/package-lock.json'
      - 'web/vite.config.ts'
      - 'web/tailwind.config.ts'
      - 'web/tsconfig.json'
      - 'web/tsconfig.app.json'
      - 'web/tsconfig.node.json'
      - 'web/postcss.config.js'
      - 'web/vitest.setup.ts'
      - 'web/components.json'

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: web
        run: npm ci

      - name: Build
        working-directory: web
        run: npm run build

      - name: Commit rebuilt dist if changed
        run: |
          # Vite's outDir is internal/serve/assets/dist (configured in
          # web/vite.config.ts). The bundle is committed there so
          # `go install github.com/bjk95/defrost/cmd/defrost@latest`
          # works without a Node toolchain — the embed directive in
          # internal/serve/assets/assets.go picks it up at build time.
          if git diff --quiet internal/serve/assets/dist; then
            echo "No dist changes; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add internal/serve/assets/dist
          git commit -m "chore: rebuild internal/serve/assets/dist [skip ci]"
          git push
