  promptfoo:
    name: promptfoo example
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install promptfoo
        run: npm install -g promptfoo@latest

      - name: Build defrost-ci
        # CI workflows use defrost-ci (the slim binary): no DuckDB cgo,
        # no embedded web bundle. Same exec/history/suppress/drop
        # subcommands as the full binary; only serve differs (it's a
        # stub that prints the install hint).
        run: go build -o defrost ./cmd/defrost-ci

      - name: Configure git auth for defrost persist
        run: |
          git config --global url."https://x-access-token:${GITHUB_TOKEN}@github.com/".insteadOf "https://github.com/"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Suppress known-intentional failures (dogfood the suppression flow)
        # Suppressions are now per-project at <project>/.defrost/suppressions.json
        # rather than centralised on the data branch, so the suppress
        # call must run from the same dir as the exec call below
        # (examples/promptfoo) — otherwise it'd write to the parent
        # repo's .defrost/ instead of the example's.
        run: |
          set -e
          cd examples/promptfoo
          ../../defrost suppress add \
            'examples/promptfoo¬answer="I have no idea",question="capital-germany-wrong",prompt="f7a68f6f0557",provider="defrost-smoke-mock"' \
            'examples/promptfoo¬answer="London is the answer",question="contaminated-output",prompt="f7a68f6f0557",provider="defrost-smoke-mock"' \
            'examples/promptfoo¬answer="paris",question="case-sensitive",prompt="f7a68f6f0557",provider="defrost-smoke-mock"' \
            'examples/promptfoo¬answer="123 invalid",question="regex-capital-digits",prompt="f7a68f6f0557",provider="defrost-smoke-mock"' \
            'examples/promptfoo¬answer="just plain text",question="unstructured",prompt="f7a68f6f0557",provider="defrost-smoke-mock"' \
            'examples/promptfoo¬answer="Berlin",question="case-insensitive-fail",prompt="f7a68f6f0557",provider="defrost-smoke-mock"' \
            'examples/promptfoo¬answer="Only Paris is here",question="contains-all-fail-vars",prompt="f7a68f6f0557",provider="defrost-smoke-mock"' \
            'examples/promptfoo¬answer="The capital is Paris",question="starts-with-fail-vars",prompt="f7a68f6f0557",provider="defrost-smoke-mock"' \
            'examples/promptfoo¬answer="not xml at all",question="xml-invalid",prompt="f7a68f6f0557",provider="defrost-smoke-mock"' \
            'examples/promptfoo¬answer="ROME",question="icontains-any-fail-vars",prompt="f7a68f6f0557",provider="defrost-smoke-mock"'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run defrost against examples/promptfoo
        run: |
          set -o pipefail
          cd examples/promptfoo
          ../../defrost exec promptfoo eval -c promptfooconfig.yaml --no-cache 2>&1 | tee out.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Assert result count matches expected
        run: |
          line=$(grep -E '^defrost: results:' examples/promptfoo/out.txt | tail -1)
          if [ -z "$line" ]; then
            echo "FAIL: no 'defrost: results:' line found"
            cat examples/promptfoo/out.txt
            exit 1
          fi
          echo "summary: $line"
          counts=$(echo "$line" | sed -E 's/^defrost: results: ([0-9]+) pass, ([0-9]+) fail, ([0-9]+) skip$/\1 \2 \3/')
          set -- $counts
          total=$(( $1 + $2 + $3 ))
          if [ "$total" -ne 30 ]; then
            echo "FAIL: expected 30 results total, got $total ($1 pass, $2 fail, $3 skip)"
            cat examples/promptfoo/out.txt
            exit 1
          fi

      - name: Upload defrost output for debugging
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: promptfoo-out
          path: examples/promptfoo/out.txt

  inspect:
    name: inspect-ai example
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install inspect-ai
        run: pip install -r examples/inspect/requirements.txt

      - name: Build defrost-ci
        # CI workflows use defrost-ci (the slim binary): no DuckDB cgo,
        # no embedded web bundle. Same exec/history/suppress/drop
        # subcommands as the full binary; only serve differs (it's a
        # stub that prints the install hint).
        run: go build -o defrost ./cmd/defrost-ci

      - name: Configure git auth for defrost persist
        run: |
          git config --global url."https://x-access-token:${GITHUB_TOKEN}@github.com/".insteadOf "https://github.com/"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Suppress known-intentional failures (dogfood the suppression flow)
        # Suppressions are per-project at <project>/.defrost/suppressions.json,
        # so suppress must run from the same dir as exec below.
        run: |
          set -e
          cd examples/inspect
          ../../defrost suppress add \
            'examples/inspect¬task="capital_cities",sample="germany-fail"' \
            'examples/inspect¬task="capital_cities",sample="empty-fail"'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run defrost against examples/inspect
        run: |
          set -o pipefail
          cd examples/inspect
          # --display plain disables Inspect's Rich-based progress UI so the
          # defrost summary line lands at column 0 in out.txt (Rich's
          # animated progress bars otherwise leave whitespace runs that
          # prevent the assertion below from anchoring on ^defrost:).
          ../../defrost exec inspect eval task.py --model none --display plain 2>&1 | tee out.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Assert result count matches expected
        run: |
          # Inspect AI exits 0 even when samples fail scoring, so the
          # regression-detection signal is the pass/fail breakdown rather
          # than the exit code. Expected: 2 pass, 2 fail, 0 skip = 4 total.
          # Strip leading whitespace defensively in case Rich progress output
          # leaks through despite --display plain.
          line=$(grep -E 'defrost: results:' examples/inspect/out.txt | tail -1 | sed 's/^[[:space:]]*//')
          if [ -z "$line" ]; then
            echo "FAIL: no 'defrost: results:' line found"
            cat examples/inspect/out.txt
            exit 1
          fi
          echo "summary: $line"
          counts=$(echo "$line" | sed -E 's/^defrost: results: ([0-9]+) pass, ([0-9]+) fail, ([0-9]+) skip$/\1 \2 \3/')
          set -- $counts
          if [ "$1" -ne 2 ] || [ "$2" -ne 2 ] || [ "$3" -ne 0 ]; then
            echo "FAIL: expected 2 pass / 2 fail / 0 skip, got $1/$2/$3"
            cat examples/inspect/out.txt
            exit 1
          fi

      - name: Upload defrost output for debugging
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: inspect-out
          path: examples/inspect/out.txt

