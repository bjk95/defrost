name: integration

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  unit-tests:
    name: go unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build defrost-ci
        # CI workflows use defrost-ci (the slim binary): no DuckDB cgo,
        # no embedded web bundle. Same exec/history/suppress/drop
        # subcommands as the full binary; only serve differs (it's a
        # stub that prints the install hint).
        run: go build -o defrost ./cmd/defrost-ci

      - name: Configure git auth for defrost persist
        run: |
          git config --global url."https://x-access-token:${GITHUB_TOKEN}@github.com/".insteadOf "https://github.com/"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run defrost against go unit tests
        # ./internal/... rather than ./... so the dogfood step doesn't
        # try to compile cmd/defrost (which pulls in DuckDB cgo and a
        # ~80MB prebuilt static lib via go-duckdb v2). cmd/* packages
        # have no tests of their own; the explicit `go build -o
        # defrost-ci ./cmd/defrost-ci` step above already verifies the
        # CI binary compiles.
        run: ./defrost exec go test ./internal/...
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  python:
    name: pytest example
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pytest and OTel logging deps
        # opentelemetry-* packages are only consumed by the example's
        # conftest.py when defrost has set OTEL_EXPORTER_OTLP_ENDPOINT
        # in the env, so the example still runs cleanly under plain
        # `pytest` (the OTel setup short-circuits when the env var
        # is absent).
        run: |
          pip install pytest
          pip install \
            opentelemetry-api \
            opentelemetry-sdk \
            opentelemetry-exporter-otlp-proto-http

      - name: Build defrost-ci
        # CI workflows use defrost-ci (the slim binary): no DuckDB cgo,
        # no embedded web bundle. Same exec/history/suppress/drop
        # subcommands as the full binary; only serve differs (it's a
        # stub that prints the install hint).
        run: go build -o defrost ./cmd/defrost-ci

      - name: Configure git auth for defrost persist
        # actions/checkout@v4 wires auth into the checked-out repo,
        # but defrost clones into its own temp dir to push the data
        # branch — that fresh clone has no auth unless we set a global
        # url.<base>.insteadOf rule. Without this, persist silently
        # fails (the warn-not-fail path), and no run files land on
        # origin/_defrost.
        run: |
          git config --global url."https://x-access-token:${GITHUB_TOKEN}@github.com/".insteadOf "https://github.com/"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run defrost against examples/python
        id: run
        run: |
          set +e
          ./defrost exec pytest examples/python/ > out.txt 2>&1
          echo "exit=$?" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Assert exit code is non-zero (intentional failures)
        run: |
          code="${{ steps.run.outputs.exit }}"
          echo "defrost exit code: $code"
          if [ "$code" -eq 0 ]; then
            echo "FAIL: expected non-zero exit (test_fail, test_raises, test_with_broken_fixture are intentional)"
            cat out.txt
            exit 1
          fi

      - name: Assert result count matches expected
        run: |
          # Parse the "defrost: results: P pass, F fail, S skip" summary
          # line. Total = P + F + S. Expected 10 across the pytest example.
          line=$(grep -E '^defrost: results:' out.txt | tail -1)
          if [ -z "$line" ]; then
            echo "FAIL: no 'defrost: results:' line found"
            cat out.txt
            exit 1
          fi
          echo "summary: $line"
          counts=$(echo "$line" | sed -E 's/^defrost: results: ([0-9]+) pass, ([0-9]+) fail, ([0-9]+) skip$/\1 \2 \3/')
          set -- $counts
          total=$(( $1 + $2 + $3 ))
          if [ "$total" -ne 10 ]; then
            echo "FAIL: expected 10 results total, got $total ($1 pass, $2 fail, $3 skip)"
            cat out.txt
            exit 1
          fi

      - name: Readback — verify all three signals landed on origin/_defrost
        # Replaces the older "grep stderr counts" check with a real
        # readback against the data branch. This is what would have
        # caught the recent gitBackend-writing-under-data/ regression
        # at the source (the file simply wouldn't exist at the
        # expected path), and it's signal-agnostic: every example job
        # uses this same script with the signals it expects.
        run: .github/scripts/readback.sh out.txt _defrost traces metrics logs

      - name: Upload defrost output for debugging
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: python-out
          path: out.txt

