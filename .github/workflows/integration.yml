          exit 0

      - name: Assert exit code is non-zero (intentional failures)
        run: |
          code="${{ steps.run.outputs.exit }}"
          echo "defrost exit code: $code"
          if [ "$code" -eq 0 ]; then
            echo "FAIL: expected non-zero exit (intentional failures present)"
            cat examples/typescript/out.txt
            exit 1
          fi

      - name: Assert result count matches expected
        run: |
          line=$(grep -E '^defrost: results:' examples/typescript/out.txt | tail -1)
          if [ -z "$line" ]; then
            echo "FAIL: no 'defrost: results:' line found"
            cat examples/typescript/out.txt
            exit 1
          fi
          echo "summary: $line"
          counts=$(echo "$line" | sed -E 's/^defrost: results: ([0-9]+) pass, ([0-9]+) fail, ([0-9]+) skip$/\1 \2 \3/')
          set -- $counts
          total=$(( $1 + $2 + $3 ))
