name: integration

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  unit-tests:
    name: go unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build defrost
        run: go build -o defrost .

      - name: Configure git auth for defrost persist
        run: |
          git config --global url."https://x-access-token:${GITHUB_TOKEN}@github.com/".insteadOf "https://github.com/"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run defrost against go unit tests
        run: ./defrost exec go test ./...
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  python:
    name: pytest example
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pytest
        run: pip install pytest

      - name: Build defrost
        run: go build -o defrost .

      - name: Run defrost against examples/python
        id: run
        run: |
          set +e
          ./defrost exec pytest examples/python/ > out.txt 2>&1
          echo "exit=$?" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Assert exit code is non-zero (intentional failures)
        run: |
          code="${{ steps.run.outputs.exit }}"
          echo "defrost exit code: $code"
          if [ "$code" -eq 0 ]; then
            echo "FAIL: expected non-zero exit (test_fail, test_raises, test_with_broken_fixture are intentional)"
            cat out.txt
            exit 1
          fi

      - name: Assert result count matches expected
        run: |
          # Parse the "defrost: results: P pass, F fail, S skip" summary
          # line. Total = P + F + S. Expected 10 across the pytest example.
          line=$(grep -E '^defrost: results:' out.txt | tail -1)
          if [ -z "$line" ]; then
            echo "FAIL: no 'defrost: results:' line found"
            cat out.txt
            exit 1
          fi
          echo "summary: $line"
          counts=$(echo "$line" | sed -E 's/^defrost: results: ([0-9]+) pass, ([0-9]+) fail, ([0-9]+) skip$/\1 \2 \3/')
          set -- $counts
          total=$(( $1 + $2 + $3 ))
          if [ "$total" -ne 10 ]; then
            echo "FAIL: expected 10 results total, got $total ($1 pass, $2 fail, $3 skip)"
            cat out.txt
            exit 1
          fi

      - name: Upload defrost output for debugging
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: python-out
          path: out.txt

  javascript:
    name: jest example (js)
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install jest
        run: npm install
        working-directory: examples/javascript

      - name: Build defrost
        run: go build -o defrost .

      - name: Run defrost against examples/javascript
        id: run
        run: |
          set +e
          cd examples/javascript
          ../../defrost exec npm test > out.txt 2>&1
          echo "exit=$?" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Assert exit code is non-zero (intentional failures)
        run: |
          code="${{ steps.run.outputs.exit }}"
          echo "defrost exit code: $code"
          if [ "$code" -eq 0 ]; then
            echo "FAIL: expected non-zero exit (intentional failures present)"
            cat examples/javascript/out.txt
            exit 1
          fi

      - name: Assert result count matches expected
        run: |
          line=$(grep -E '^defrost: results:' examples/javascript/out.txt | tail -1)
          if [ -z "$line" ]; then
            echo "FAIL: no 'defrost: results:' line found"
            cat examples/javascript/out.txt
            exit 1
          fi
          echo "summary: $line"
          counts=$(echo "$line" | sed -E 's/^defrost: results: ([0-9]+) pass, ([0-9]+) fail, ([0-9]+) skip$/\1 \2 \3/')
          set -- $counts
          total=$(( $1 + $2 + $3 ))
          if [ "$total" -ne 12 ]; then
            echo "FAIL: expected 12 results total, got $total ($1 pass, $2 fail, $3 skip)"
            cat examples/javascript/out.txt
            exit 1
          fi

      - name: Upload defrost output for debugging
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: javascript-out
          path: examples/javascript/out.txt

  typescript:
    name: jest example (ts)
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install jest + ts-jest
        run: npm install
