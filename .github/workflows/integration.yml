  web-vitest:
    name: defrost on vitest on web (dogfood)
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install web deps
        run: npm ci
        working-directory: web

      - name: Build defrost-ci
        # CI workflows use defrost-ci (the slim binary): no DuckDB cgo,
        # no embedded web bundle. Same exec/history/suppress/drop
        # subcommands as the full binary; only serve differs (it's a
        # stub that prints the install hint).
        run: go build -o defrost ./cmd/defrost-ci

      - name: Run defrost against web/ tests
        id: run
        run: |
          set +e
          cd web
          ../defrost exec --no-persist npm test > out.txt 2>&1
          echo "exit=$?" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Assert exit 0 (web tests should pass)
        run: |
          code="${{ steps.run.outputs.exit }}"
          echo "defrost exit code: $code"
          if [ "$code" -ne 0 ]; then
            echo "FAIL: expected exit 0 from web tests"
            cat web/out.txt
            exit 1
          fi

      - name: Assert >= 20 results (defrost actually parsed)
        run: |
          line=$(grep -E '^defrost: results:' web/out.txt | tail -1)
          if [ -z "$line" ]; then
            echo "FAIL: no 'defrost: results:' line found"
            cat web/out.txt
            exit 1
          fi
          echo "summary: $line"
          counts=$(echo "$line" | sed -E 's/^defrost: results: ([0-9]+) pass, ([0-9]+) fail, ([0-9]+) skip$/\1 \2 \3/')
          set -- $counts
          total=$(( $1 + $2 + $3 ))
          if [ "$total" -lt 20 ]; then
            echo "FAIL: expected >= 20 results total, got $total"
            cat web/out.txt
            exit 1
          fi

      - name: Upload defrost output for debugging
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: web-vitest-out
          path: web/out.txt
