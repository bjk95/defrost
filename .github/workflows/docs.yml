name: Deploy docs site

# Builds the static documentation site (web/dist-docs/) and publishes
# it to GitHub Pages. Triggered when the public Markdown under docs/
# changes, when the docs-app source changes, or when the build config
# / shared shadcn-ui pieces it depends on are updated.
#
# docs/_internal/ is intentionally not in the path filter — internal
# specs are excluded from the static site at build time (see
# web/src/docs-app/pages.ts), so editing them must not trigger a deploy.
on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '!docs/_internal/**'
      - 'web/src/docs-app/**'
      - 'web/src/components/ui/**'
      - 'web/src/index.css'
      - 'web/src/lib/utils.ts'
      - 'web/docs.html'
      - 'web/vite.docs.config.ts'
      - 'web/package.json'
      - 'web/package-lock.json'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one deploy at a time, and cancel any older runs that are still
# queued — we always want main's tip on Pages, not a stale build.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: web
        run: npm ci

      - name: Build docs site
        working-directory: web
        env:
          # GH Pages serves project sites under /<repo>/. The docs
          # bundler picks up DOCS_BASE so absolute asset URLs resolve
          # correctly when the site is hosted at /defrost/.
          DOCS_BASE: /defrost/
        run: npm run build:docs

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist-docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
